<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/css/bootstrap.css" href="/style.css">
<meta charset="UTF-8">
<title>Fluid Grid Layout</title>
<style>
body {
font-family: Arial, sans-serif;
padding: 20px;
}
.row {
width: 100%;
display: flex;
flex-wrap: wrap;
}
.column {
width: 33.33%;
background: #4CAF50;
color: white;
padding: 20px;
box-sizing: border-box;
border: 2px solid white;
text-align: center;
}
@media (max-width: 600px) {
.column {
width: 100%;
}
}
</style>
</head>
<body>
<h2>Fluid Grid Layout </h2>
<div class="row">
<div class="column">Column 1</div>
<div class="column">Column 2</div>
<div class="column">Column 3</div>
<div class="column">Column 4</div>
<div class="column">Column 5</div>
<div class="column">Column 6</div>
<div class="column">Column 7</div>
<div class="column">Column 8</div>
<div class="column">Column 9</div>
<div class="column">Column 10</div>
<div class="column">Column 11</div>
<div class="column">Column 12</div>
</div>
<script src="https:// "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
 <srcipt src="/js/bootstrap.js"></srcipt>  
</body>
</html>
